<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20242b">
<title>VORSCHAU - Verwaltung - WiFi Hotspot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%232f5d50'/%3E%3Cpath d='M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='19' r='1.4' fill='white'/%3E%3C/svg%3E">
<style>
:root{--ink:#20242b;--paper:#f3efe6;--card:#fffdf8;--line:#c9c2b4;--mut:#6b6457;--accent:#2f5d50;--accent2:#24473d;--err:#8a2f2f;--ok:#2f5d50;--warn:#8a5a16}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;font-weight:600}
header{background:var(--ink);color:#f3efe6;padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:5}
header .ic{width:24px;height:24px;fill:none;stroke:#f3efe6;stroke-width:1.8;flex:none}
header h1{font-size:18px;flex:1}
header .sub{font-size:12px;color:#c9c2b4;font-family:inherit}
#lout{background:none;border:1px solid #f3efe6;color:#f3efe6;padding:7px 14px;border-radius:4px;cursor:pointer;font-size:13px}
#lout:hover{background:rgba(255,255,255,.1)}
main{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:18px}
.card h2{font-size:17px;margin-bottom:4px}
.card .hint{color:var(--mut);font-size:13px;margin:4px 0 14px}
label{display:block;font-size:12.5px;color:var(--mut);margin:14px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
label:first-of-type{margin-top:0}
input[type=text],input[type=password],select{width:100%;max-width:340px;padding:10px 11px;border:1px solid var(--line);border-radius:4px;font-size:15px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
button.btn{padding:10px 16px;border:1px solid var(--accent2);border-radius:4px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button.btn:hover{background:var(--accent2)}
button.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button.btn.ghost:hover{background:#f3efe6}
button.btn.dng{background:#fff;color:var(--err);border-color:var(--err)}
button.btn.dng:hover{background:#f6e9e9}
button.btn.sm{padding:6px 11px;font-size:12.5px}
button:disabled{opacity:.55;cursor:default}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv div:nth-child(odd){color:var(--mut)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;font-size:12.5px;font-weight:600;background:#e7e2d4;color:var(--mut)}
.tag.ok{background:#e4ede9;color:var(--ok)}
.tag.err{background:#f6e9e9;color:var(--err)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.off{background:#a39b8a}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:4px;border:1px solid var(--warn);background:#f8efe0;color:#5b3c0c;font-size:13.5px;margin-bottom:16px}
.banner b{display:block;margin-bottom:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.3px;padding:0 8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid #e7e2d4}
.empty{color:var(--mut);font-size:13.5px;padding:10px 0}
.err-msg{margin-top:10px;padding:9px 12px;border:1px solid var(--err);border-radius:4px;background:#f6e9e9;color:var(--err);font-size:13.5px}
.wlrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px;cursor:pointer;background:#fff}
.wlrow:hover{background:#f3efe6}
.wlrow b{flex:1;font-size:14px;font-weight:600}
.wlrow .mut{color:var(--mut);font-size:12px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:5px;font-size:13.5px;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.toast.err{background:var(--err)}
.hidden{display:none !important}
@media(max-width:480px){input[type=text],input[type=password],select{max-width:100%}}
</style>
</head>
<body>

<div id="login" class="hidden">
<div class="card" style="max-width:360px;width:100%">
<h2 style="margin-bottom:4px">WiFi Hotspot</h2>
<p class="hint" style="margin-top:0">Verwaltung</p>
<form id="lf">
<label for="lu">Benutzername</label><input id="lu" type="text" autocomplete="username">
<label for="lp">Passwort</label><input id="lp" type="password" autocomplete="current-password">
<div id="lerr" class="err-msg hidden"></div>
<button class="btn" type="submit" style="margin-top:16px;width:100%">Anmelden</button>
</form>
</div>
</div>

<div id="app" class="hidden">
<header>
<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2" fill="#f3efe6" stroke="none"/></svg>
<div><h1>WiFi Hotspot</h1><div class="sub">Verwaltung</div></div>
<button id="lout">Abmelden</button>
</header>
<main id="main"></main>
</div>

<script>
// ===== VORSCHAU-MODUS: simuliert den ESP32 komplett im Browser (keine Hardware nötig) =====
(function () {
  const TOK = 't'.repeat(32);
  const S = { auth: true, user: 'admin', pass: 'admin123', pwDefault: true, notice: '', t0: Date.now(),
    apSsid: 'WiFi Hotspot', apCh: 6, accessPass: 'hotspot123', accessDefault: true,
    known: [{ ssid: 'Heim-WLAN', pass: 'geheim123' }, { ssid: 'Schule-Gast', pass: '' }],
    activeIdx: 0, staState: 'connected',
    scan: 'idle', nets: [], scanAt: 0, clients: 2 };
  try { if (sessionStorage.getItem('vorschauUpdated')) { S.notice = ''; sessionStorage.removeItem('vorschauUpdated'); } } catch (e) {}
  const up = () => Math.floor((Date.now() - S.t0) / 1000) + 100;
  const NETS = [['FRITZ!Box 7590 XY', -42, 1, 'WPA2/WPA3'], ['Vodafone-A1B2C3', -58, 6, 'WPA2'], ['Telekom_FON', -66, 11, 'Offen'], ['Schule-Gast', -55, 6, 'Offen'],
    ['TP-Link_5F2A', -74, 3, 'WPA/WPA2'], ['Nachbar-WLAN', -80, 1, 'WPA2'], ['Kabel-8842', -83, 11, 'WPA3'], ['(versteckt)', -88, 13, 'WPA2-Enterprise']]
    .map(n => ({ ssid: n[0], rssi: n[1], ch: n[2], auth: n[3], hidden: n[0] === '(versteckt)' }));
  function tick() {
    if (S.scan === 'running' && Date.now() > S.scanAt) { S.scan = 'done'; S.nets = NETS.map(n => ({ ...n, rssi: n.rssi - Math.round(Math.random() * 3) })); }
  }
  const status = () => ({ fw: '2.0.0', board: 'ESP32-S3 N16R8', up: up(), auth: S.auth, notice: S.notice,
    chip: { model: 'ESP32-S3', rev: 2, cores: 2, mhz: 240, mac: 'AA:BB:CC:DD:EE:FF', sdk: 'v5.5.1', core: '3.3.12' },
    mem: { heap: 340000, free: 210000, psram: 8388608, flash: 16777216 },
    wifi: { ap: true, apSsid: S.apSsid, apCh: S.apCh, apIp: '192.168.4.1', clients: S.clients,
      repeat: { ssid: S.known[S.activeIdx] ? S.known[S.activeIdx].ssid : '', state: S.staState, rssi: -52, internet: S.staState === 'connected' } },
    warn: { defaultWeb: S.pwDefault, defaultAccess: S.accessDefault } });
  const R = (status, body) => ({ status, body });
  function handle(method, p, a, token) {
    tick();
    if (p === '/api/public') return R(200, { name: 'WiFi Hotspot', fw: '2.0.0', auth: S.auth });
    if (p === '/api/access/info') return R(200, { title: 'WiFi Hotspot', online: false, internet: S.staState === 'connected' });
    if (p === '/api/access/login') return a.get('pass') === S.accessPass ? R(200, { ok: true }) : R(401, { ok: false, error: 'Falsches Zugangspasswort' });
    if (p === '/api/access/logout') return R(200, { ok: true });
    if (p === '/api/login') { if (a.get('user') === S.user && a.get('pass') === S.pass) return R(200, { ok: true, token: TOK }); return R(401, { ok: false, error: 'Benutzername oder Passwort falsch' }); }
    if (S.auth && token !== TOK) return R(401, { ok: false, error: 'Nicht angemeldet' });
    const ok = m => R(200, m ? { ok: true, msg: m } : { ok: true });
    switch (p) {
      case '/api/logout': return ok();
      case '/api/status': return R(200, status());
      case '/api/settings': return R(200, { apSsid: S.apSsid, apCh: S.apCh, accessPass: S.accessPass, accessDefault: S.accessDefault, webUser: S.user, authEnabled: S.auth });
      case '/api/ap/save': S.apSsid = a.get('ssid'); S.apCh = +a.get('ch'); return ok('Gespeichert. Das WLAN wird gleich neu gestartet.');
      case '/api/access/save': S.accessPass = a.get('pass'); S.accessDefault = false; return ok('Gespeichert.');
      case '/api/settings/web': if (S.auth && a.get('oldpass') !== S.pass) return R(403, { ok: false, error: 'Aktuelles Passwort ist falsch' }); if (a.get('newpass')) { S.pass = a.get('newpass'); S.pwDefault = false; } S.user = a.get('user'); S.auth = a.get('auth') === '1'; return ok('Gespeichert.');
      case '/api/known': return R(200, { nets: S.known.map((n, i) => ({ ssid: n.ssid, active: i === S.activeIdx })), max: 6 });
      case '/api/known/add': { const ssid = a.get('ssid'), pass = a.get('pass') || ''; const i = S.known.findIndex(n => n.ssid === ssid); if (i >= 0) S.known[i].pass = pass; else S.known.push({ ssid, pass }); S.activeIdx = S.known.findIndex(n => n.ssid === ssid); S.staState = 'connected'; return ok('Gespeichert. Verbinde...'); }
      case '/api/known/remove': { const i = S.known.findIndex(n => n.ssid === a.get('ssid')); if (i < 0) return R(404, { ok: false, error: 'WLAN nicht gefunden' }); S.known.splice(i, 1); if (S.activeIdx >= S.known.length) S.activeIdx = 0; return ok(); }
      case '/api/wifi/scan': return R(200, { state: S.scan === 'running' ? 'running' : (S.scan === 'done' ? 'done' : 'idle'), count: S.nets.length, nets: S.nets });
      case '/api/wifi/scan/start': S.scan = 'running'; S.scanAt = Date.now() + 1200; return ok();
      case '/api/wifi/scan/stop': S.scan = S.nets.length ? 'done' : 'idle'; return ok();
      case '/api/notice/dismiss': S.notice = ''; return ok();
      case '/api/system/restart': return ok();
      case '/api/system/factory': if (a.get('confirm') !== 'RESET') return R(400, { ok: false, error: 'Bestätigung fehlt' }); return ok();
      default: return R(404, { ok: false, error: 'Unbekannter Endpunkt' });
    }
  }
  const BASE = 'http://esp32.vorschau/';
  const realFetch = window.fetch.bind(window);
  window.fetch = async (url, opts) => {
    opts = opts || {};
    const u = new URL(url, BASE);
    if (!u.pathname.startsWith('/api/')) return realFetch(url, opts);
    const method = (opts.method || 'GET').toUpperCase();
    const a = new URLSearchParams(opts.body || '');
    const token = (opts.headers && opts.headers['X-Token']) || u.searchParams.get('t') || '';
    const r = handle(method, u.pathname, a, token);
    return new Response(JSON.stringify(r.body), { status: r.status, headers: { 'Content-Type': 'application/json' } });
  };
})();

</script>
<script>
"use strict";
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let TOKEN='';
try{ TOKEN=sessionStorage.getItem('tok')||''; }catch(e){}
function setToken(t){ TOKEN=t||''; try{ if(t) sessionStorage.setItem('tok',t); else sessionStorage.removeItem('tok'); }catch(e){} }
function toast(msg,kind){
  const d=document.createElement('div'); d.className='toast'+(kind==='err'?' err':''); d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),3200);
}
async function api(path,opts){
  opts=opts||{};
  const headers=Object.assign({},opts.headers||{});
  if(TOKEN) headers['X-Token']=TOKEN;
  const r=await fetch(path+((path.indexOf('?')<0)?'?':'&')+'t='+encodeURIComponent(TOKEN),Object.assign({},opts,{headers}));
  let d=null; try{ d=await r.json(); }catch(e){}
  if(r.status===401){ showLogin(); throw new Error('auth'); }
  if(!r.ok || (d && d.ok===false)) throw new Error((d&&d.error)||('HTTP '+r.status));
  return d;
}
async function act(path,params,okMsg){
  try{
    const body=new URLSearchParams(params||{}).toString();
    const d=await api(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    if(okMsg!==false) toast(okMsg||(d&&d.msg)||'Gespeichert.');
    return d;
  }catch(e){ if(e.message!=='auth') toast(e.message,'err'); return null; }
}

function showLogin(){
  setToken('');
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
}
function showApp(){
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  paintMain();
  refreshStatus();
}

$('#lf').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const e=$('#lerr'); e.classList.add('hidden');
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'user='+encodeURIComponent($('#lu').value)+'&pass='+encodeURIComponent($('#lp').value)});
    const d=await r.json();
    if(!r.ok || !d.ok) throw new Error(d.error||'Anmeldung fehlgeschlagen');
    setToken(d.token);
    showApp();
  }catch(err){ e.textContent=err.message; e.classList.remove('hidden'); }
});
$('#lout').addEventListener('click', async ()=>{
  await api('/api/logout',{method:'POST'}).catch(()=>{});
  showLogin();
});

let ST=null, SET=null;

function fmtB(n){
  if(!n) return '0 B';
  const u=['B','KB','MB','GB']; let i=0;
  while(n>=1024 && i<u.length-1){ n/=1024; i++; }
  return n.toFixed(i?1:0)+' '+u[i];
}
function fmtUp(s){
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  return h?(h+' Std. '+m+' Min.'):(m+' Min.');
}

function paintMain(){
  $('#main').innerHTML =
    '<div id="banners"></div>'+
    '<div class="card" id="c-status"><h2>Status</h2><div class="hint">Wird geladen...</div></div>'+
    '<div class="card" id="c-ap"><h2>WiFi Hotspot</h2><div class="hint">Name und Funkkanal des eigenen WLANs. Das Hotspot-WLAN ist immer offen (kein WLAN-Passwort) - Zugang wird über die Login-Seite geregelt.</div>'+
      '<label for="apSsid">Name (SSID)</label><input id="apSsid" maxlength="32">'+
      '<label for="apCh">Kanal</label><select id="apCh">'+Array.from({length:11},(_,i)=>'<option>'+(i+1)+'</option>').join('')+'</select>'+
      '<div class="bar"><button class="btn" id="apSave">Speichern &amp; neu starten</button></div></div>'+
    '<div class="card" id="c-access"><h2>Zugangspasswort</h2><div class="hint">Dieses Passwort verlangt die Login-Seite, bevor ein Gerät Internet bekommt. Es ist unabhängig vom Admin-Login und zum Weitergeben gedacht.</div>'+
      '<label for="accCur">Aktuell</label><input id="accCur" type="text" readonly style="background:#f3efe6">'+
      '<label for="accNew">Neues Zugangspasswort (4-63 Zeichen)</label><input id="accNew" type="text" maxlength="63" placeholder="unverändert">'+
      '<div class="bar"><button class="btn" id="accSave">Speichern</button></div></div>'+
    '<div class="card" id="c-known"><h2>Bekannte WLANs</h2><div class="hint">WLANs, die der ESP32 automatisch sucht und wiederholt. An jedem Ort wird automatisch das gerade erreichbare benutzt.</div>'+
      '<table class="tbl"><thead><tr><th>Name</th><th>Status</th><th></th></tr></thead><tbody id="knTb"></tbody></table>'+
      '<div class="bar"><button class="btn ghost sm" id="knScan">WLANs suchen</button><span id="knScanInfo" class="hint" style="margin:0"></span></div>'+
      '<div id="knList" style="margin-top:10px"></div>'+
      '<div id="knForm" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">'+
        '<div class="hint" style="margin:0 0 8px">Hinzufügen: <b id="knPicked"></b></div>'+
        '<input type="hidden" id="knSsid">'+
        '<div id="knPassWrap"><label for="knPass">Passwort</label><input id="knPass" type="text" maxlength="63"></div>'+
        '<div class="bar"><button class="btn sm" id="knAdd">Hinzufügen</button><button class="btn ghost sm" id="knCancel">Abbrechen</button></div></div>'+
      '<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--mut);font-size:13px">Verstecktes WLAN manuell eingeben</summary>'+
        '<label for="knSsidM">Name (SSID)</label><input id="knSsidM" maxlength="32">'+
        '<label for="knPassM">Passwort</label><input id="knPassM" type="text" maxlength="63">'+
        '<div class="bar"><button class="btn sm" id="knAddM">Hinzufügen</button></div></details></div>'+
    '<div class="card" id="c-web"><h2>Admin-Zugang</h2>'+
      '<label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:400;color:var(--ink)"><input type="checkbox" id="wAuth" style="width:auto"> Login für die Verwaltung aktivieren</label>'+
      '<label for="wUser">Benutzername</label><input id="wUser" type="text" maxlength="32" autocomplete="username">'+
      '<label for="wOld">Aktuelles Passwort (zur Bestätigung)</label><input id="wOld" type="password" autocomplete="current-password">'+
      '<label for="wNew">Neues Passwort (mind. 6 Zeichen, leer = unverändert)</label><input id="wNew" type="password" autocomplete="new-password">'+
      '<div class="bar"><button class="btn" id="wSave">Speichern</button></div></div>'+
    '<div class="card" id="c-sys"><h2>System</h2><div class="bar"><button class="btn ghost" id="rst">Neustart</button><button class="btn dng" id="fac">Werkseinstellungen</button></div></div>';

  api('/api/settings').then(s=>{
    SET=s;
    $('#apSsid').value=s.apSsid; $('#apCh').value=s.apCh;
    $('#accCur').value=s.accessPass;
    $('#wUser').value=s.webUser; $('#wAuth').checked=s.authEnabled;
  }).catch(()=>{});

  loadKnown();

  $('#apSave').addEventListener('click', async ()=>{
    await act('/api/ap/save',{ssid:$('#apSsid').value,ch:$('#apCh').value});
  });
  $('#accSave').addEventListener('click', async ()=>{
    const v=$('#accNew').value;
    if(!v){ toast('Bitte ein neues Zugangspasswort eingeben','err'); return; }
    const r=await act('/api/access/save',{pass:v});
    if(r){ $('#accNew').value=''; refreshStatus(); api('/api/settings').then(s=>{SET=s;$('#accCur').value=s.accessPass;}).catch(()=>{}); }
  });
  $('#wSave').addEventListener('click', async ()=>{
    const r=await act('/api/settings/web',{user:$('#wUser').value,oldpass:$('#wOld').value,newpass:$('#wNew').value,auth:$('#wAuth').checked?'1':'0'});
    if(r){ $('#wOld').value=''; $('#wNew').value=''; refreshStatus(); }
  });
  $('#rst').addEventListener('click', async ()=>{
    if(!confirm('ESP32 jetzt neu starten?')) return;
    await act('/api/system/restart',{});
  });
  $('#fac').addEventListener('click', async ()=>{
    if(!confirm('ALLE Einstellungen (WLANs, Passwörter) auf Werkseinstellungen zurücksetzen?')) return;
    if(prompt('Zur Bestätigung RESET eintippen:')!=='RESET') return;
    await act('/api/system/factory',{confirm:'RESET'});
    setToken(''); toast('Werkseinstellungen werden hergestellt...');
  });

  let nets=[];
  const paintNets=()=>{
    $('#knList').innerHTML = nets.length ? nets.map(n=>
      '<div class="wlrow" data-ssid="'+esc(n.ssid)+'" data-open="'+(n.auth==='Offen'?1:0)+'"><b>'+esc(n.ssid)+'</b><span class="mut">'+esc(n.auth)+' &middot; Kanal '+n.ch+' &middot; '+n.rssi+' dBm</span></div>'
    ).join('') : '<div class="empty">Noch keine Ergebnisse.</div>';
    $$('.wlrow',$('#knList')).forEach(r=>r.addEventListener('click', ()=>pickNet(r.dataset.ssid, r.dataset.open==='1')));
  };
  const pickNet=(ssid,isOpen)=>{
    $('#knSsid').value=ssid; $('#knPicked').textContent=ssid;
    $('#knPass').value=''; $('#knPassWrap').style.display=isOpen?'none':'';
    $('#knForm').style.display='';
  };
  $('#knCancel').addEventListener('click', ()=>{ $('#knForm').style.display='none'; });
  $('#knAdd').addEventListener('click', async ()=>{
    const r=await act('/api/known/add',{ssid:$('#knSsid').value,pass:$('#knPass').value});
    if(r){ $('#knForm').style.display='none'; loadKnown(); }
  });
  $('#knAddM').addEventListener('click', async ()=>{
    const ssid=$('#knSsidM').value.trim();
    if(!ssid){ toast('Bitte einen WLAN-Namen eingeben','err'); return; }
    const r=await act('/api/known/add',{ssid,pass:$('#knPassM').value});
    if(r){ $('#knSsidM').value=''; $('#knPassM').value=''; loadKnown(); }
  });
  $('#knScan').addEventListener('click', async ()=>{
    $('#knScan').disabled=true; $('#knScanInfo').textContent='Suche läuft...';
    if(!await act('/api/wifi/scan/start',{},false)){ $('#knScan').disabled=false; $('#knScanInfo').textContent=''; return; }
    for(let i=0;i<40;i++){
      await sleep(700);
      const d=await api('/api/wifi/scan').catch(()=>null);
      if(d && d.state!=='running'){ nets=d.nets.slice().sort((a,b)=>b.rssi-a.rssi); paintNets(); break; }
    }
    $('#knScan').disabled=false; $('#knScanInfo').textContent=nets.length+' WLANs gefunden';
  });
}

async function loadKnown(){
  try{
    const d=await api('/api/known');
    $('#knTb').innerHTML = d.nets.length ? d.nets.map(n=>
      '<tr><td>'+esc(n.ssid)+'</td><td>'+(n.active?'<span class="tag ok"><span class="dot"></span>aktiv</span>':'<span class="tag">gespeichert</span>')+'</td>'+
      '<td><button class="btn sm dng" data-ssid="'+esc(n.ssid)+'">Entfernen</button></td></tr>'
    ).join('') : '<tr><td colspan="3" class="empty">Noch kein WLAN gespeichert.</td></tr>';
    $$('#knTb [data-ssid]').forEach(b=>b.addEventListener('click', async ()=>{
      if(!confirm('WLAN "'+b.dataset.ssid+'" nicht mehr wiederholen?')) return;
      await act('/api/known/remove',{ssid:b.dataset.ssid},'Entfernt');
      loadKnown();
    }));
  }catch(e){}
}

function paintBanners(){
  if(!ST) return;
  let h='';
  if(ST.warn.defaultWeb) h+='<div class="banner"><b>Standard-Admin-Passwort aktiv</b>Bitte unter "Admin-Zugang" ein eigenes Passwort setzen.</div>';
  if(ST.warn.defaultAccess) h+='<div class="banner"><b>Standard-Zugangspasswort aktiv</b>Bitte unter "Zugangspasswort" ein eigenes setzen, bevor du es weitergibst.</div>';
  $('#banners').innerHTML=h;
}

function paintStatus(){
  if(!ST) return;
  const w=ST.wifi, r=w.repeat;
  const rLbl = r.state==='connected' ? 'Verbunden' : (r.state==='connecting' ? 'Verbinde...' : 'Suche WLAN...');
  const rCls = r.state==='connected' ? 'ok' : (r.state==='connecting' ? '' : 'err');
  $('#c-status').innerHTML =
    '<h2>Status</h2>'+
    '<div class="kv" style="margin-top:10px">'+
    '<div>Wiederholtes WLAN</div><div>'+(r.ssid?esc(r.ssid):'<span class="mut">keines gespeichert</span>')+' <span class="tag '+rCls+'">'+rLbl+'</span>'+(r.state==='connected'?' &middot; '+r.rssi+' dBm':'')+'</div>'+
    '<div>Internetzugang</div><div>'+(r.internet?'<span class="tag ok"><span class="dot"></span>Aktiv</span>':'<span class="tag err"><span class="dot off"></span>Nicht verfügbar</span>')+'</div>'+
    '<div>WiFi Hotspot</div><div>'+esc(w.apSsid)+' &middot; Kanal '+w.apCh+' &middot; <span class="mono">'+esc(w.apIp)+'</span></div>'+
    '<div>Verbundene Geräte</div><div>'+w.clients+'</div>'+
    '<div>Laufzeit</div><div>'+fmtUp(ST.up)+'</div>'+
    '<div>Firmware</div><div>v'+esc(ST.fw)+' &middot; '+esc(ST.board)+'</div>'+
    '</div>';
}

async function refreshStatus(){
  try{ ST=await api('/api/status'); paintStatus(); paintBanners(); }catch(e){}
}
setInterval(()=>{ if(!$('#app').classList.contains('hidden')) refreshStatus(); }, 3000);

(async ()=>{
  if(TOKEN){
    try{ await api('/api/status'); showApp(); return; }catch(e){}
  }
  showLogin();
})();
</script>
</body>
</html>
